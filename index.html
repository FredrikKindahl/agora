<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGORA - The Global Voice Gap Project</title>
    <meta name="description" content="Making the distance between people's will and political action impossible to ignore.">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        
        :root {
            --bg-base: #050505;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-cyan: #00f0ff;
            --accent-green: #00ff9d;
            --accent-red: #ff3366;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --glass-blur: blur(16px);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Animated Mesh Gradient Background */
        .bg-mesh {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background: 
                radial-gradient(circle at 15% 50%, rgba(0, 240, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(0, 255, 157, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(255, 51, 102, 0.05) 0%, transparent 50%);
            filter: blur(60px);
            animation: breathe 10s ease-in-out infinite alternate;
        }

        @keyframes breathe {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 2rem;
            position: relative;
        }
        
        /* Header */
        header {
            padding: 3rem 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .logo {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* Hero Section */
        .hero {
            margin: 4rem 0 6rem;
            text-align: center;
        }
        
        .hero h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
        }
        
        .hero p {
            font-size: 1.25rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }
        
        /* Polls Feed */
        .feed-header {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .live-pulse {
            width: 12px; height: 12px;
            background: var(--accent-red);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-red);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 51, 102, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 51, 102, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 51, 102, 0); }
        }

        .poll-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2.5rem;
            margin-bottom: 3rem;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .poll-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .poll-meta {
            font-size: 0.85rem;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        
        .poll-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 1rem;
            line-height: 1.3;
        }
        
        .poll-desc {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        
        /* Voting Buttons */
        .vote-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .btn-vote {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 1.2rem;
            border-radius: 16px;
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .btn-vote:hover {
            background: rgba(255,255,255,0.1);
            transform: scale(1.02);
        }
        
        .btn-vote.yes:hover { border-color: var(--accent-green); color: var(--accent-green); }
        .btn-vote.no:hover { border-color: var(--accent-red); color: var(--accent-red); }

        .btn-vote.selected.yes {
            background: rgba(0, 255, 157, 0.15);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }
        
        .btn-vote.selected.no {
            background: rgba(255, 51, 102, 0.15);
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        /* Results Visualization */
        .results-container {
            display: none;
            animation: slideDown 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            padding-top: 2rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bar-group {
            margin-bottom: 1.5rem;
        }
        
        .bar-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        .bar-header span.pct {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            color: white;
        }

        .bar-track {
            height: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }
        
        .bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 6px;
            transition: width 1.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        .bar-fill.people { background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green)); }
        .bar-fill.parliament { background: linear-gradient(90deg, #ff6a00, var(--accent-red)); }

        .gap-alert {
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 16px;
            background: rgba(255, 51, 102, 0.05);
            border: 1px solid rgba(255, 51, 102, 0.2);
            text-align: center;
            opacity: 0;
            transform: scale(0.95);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.8s;
        }
        
        .gap-alert.show {
            opacity: 1;
            transform: scale(1);
        }
        
        .gap-alert h4 {
            font-family: 'Outfit', sans-serif;
            color: var(--accent-red);
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }
        
        .gap-alert p {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        /* Loading State */
        .loader {
            text-align: center;
            padding: 4rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>
    
    <div class="container">
        <header>
            <div class="logo">AGORA</div>
            <a href="https://github.com/FredrikKindahl/agora" style="color: white; text-decoration: none; font-weight: 600; border: 1px solid rgba(255,255,255,0.2); padding: 0.5rem 1rem; border-radius: 50px; transition: 0.3s;" onmouseover="this.style.background='white'; this.style.color='black'" onmouseout="this.style.background='transparent'; this.style.color='white'">GitHub</a>
        </header>

        <section class="hero">
            <h1>The truth<br>in plain sight.</h1>
            <p>Decentralized polling that reveals the gap between what people want and how politicians vote. Powered by real data from the Swedish Parliament API.</p>
        </section>

        <div class="feed-header">
            <div class="live-pulse"></div>
            <h2>Live Feed</h2>
        </div>

        <div id="polls-feed">
            <div class="loader">Loading decentralized data...</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const feedContainer = document.getElementById('polls-feed');
            
            try {
                // To support local file viewing, we use a simple fetch, but fallback text if it fails
                const response = await fetch('data.json');
                if (!response.ok) throw new Error("Failed to load data");
                const polls = await response.json();
                
                feedContainer.innerHTML = ''; // Clear loader
                
                polls.forEach(poll => {
                    // Create card element
                    const card = document.createElement('div');
                    card.className = 'poll-card';
                    
                    // Format date
                    const date = new Date(poll.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                    
                    card.innerHTML = `
                        <div class="poll-meta">Vote ID: ${poll.id.substring(0,8)} • ${date}</div>
                        <h3 class="poll-title">${poll.title}</h3>
                        <p class="poll-desc">${poll.description}</p>
                        
                        <div class="vote-actions">
                            <button class="btn-vote yes">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                YES
                            </button>
                            <button class="btn-vote no">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                NO
                            </button>
                        </div>
                        
                        <div class="results-container">
                            <div class="bar-group">
                                <div class="bar-header">
                                    <span>PEOPLE'S VOTE</span>
                                    <span class="pct">${poll.people_vote.yes}% YES</span>
                                </div>
                                <div class="bar-track">
                                    <div class="bar-fill people" data-width="${poll.people_vote.yes}%"></div>
                                </div>
                            </div>
                            
                            <div class="bar-group">
                                <div class="bar-header">
                                    <span>PARLIAMENT'S VOTE</span>
                                    <span class="pct">${poll.parliament_percentage.yes}% YES</span>
                                </div>
                                <div class="bar-track">
                                    <div class="bar-fill parliament" data-width="${poll.parliament_percentage.yes}%"></div>
                                </div>
                            </div>
                            
                            <div class="gap-alert">
                                <h4>THE GAP: ${poll.gap}%</h4>
                                <p>The difference between public will and political action.</p>
                            </div>
                        </div>
                    `;
                    
                    // Add interactivity
                    const btns = card.querySelectorAll('.btn-vote');
                    const results = card.querySelector('.results-container');
                    const fills = card.querySelectorAll('.bar-fill');
                    const gapAlert = card.querySelector('.gap-alert');
                    
                    btns.forEach(btn => {
                        btn.addEventListener('click', () => {
                            // Only allow voting once for demo
                            if(results.style.display === 'block') return;
                            
                            btns.forEach(b => b.classList.remove('selected'));
                            btn.classList.add('selected');
                            
                            // Show results
                            results.style.display = 'block';
                            
                            // Trigger animations next frame
                            setTimeout(() => {
                                fills.forEach(fill => {
                                    fill.style.width = fill.getAttribute('data-width');
                                });
                                gapAlert.classList.add('show');
                            }, 50);
                        });
                    });
                    
                    feedContainer.appendChild(card);
                });
                
            } catch (err) {
                feedContainer.innerHTML = `<div class="loader">
                    <p style="color:var(--accent-red);margin-bottom:1rem;">Error loading network data.</p>
                    <p>If you are opening this file locally directly in the browser, you need to use a local web server (e.g. <code>npx serve</code> or <code>python -m http.server</code>) so it can fetch the data.json file.</p>
                </div>`;
                console.error(err);
            }
        });
    </script>
</body>
</html>
